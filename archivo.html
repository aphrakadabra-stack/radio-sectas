<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÚGJÜ RADIO — Archive</title>
    <meta name="description" content="Archive of ÚGJÜ RADIO broadcasts.">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#EA52F3">
    <link rel="canonical" href="https://ugjusectas.github.io/ugju-radio/archivo.html">
    <link rel="stylesheet" href="archivo.css?v=20260808-5">
</head>

<body>
    <main class="archive-page">
        <article class="archive-sheet">
            <header class="archive-header">
                <p
                    class="radio-name"
                    aria-label="ÚGJÜ RADIO"
                >
                    <span
                        class="radio-name-line"
                        aria-hidden="true"
                    >
                        <span>Ú</span>
                        <span>G</span>
                        <span>J</span>
                        <span>Ü</span>
                    </span>

                    <span
                        class="radio-name-line"
                        aria-hidden="true"
                    >
                        <span>R</span>
                        <span>A</span>
                        <span>D</span>
                        <span>I</span>
                        <span>O</span>
                    </span>
                </p>
                <h1 id="archive-title">ARCHIVE</h1>
                <p id="archive-subtitle">Broadcasts kept in the house</p>
            </header>

            <ol class="archive-list" id="archive-list"></ol>

            <p class="archive-status" id="archive-status" aria-live="polite"></p>

            <footer class="archive-footer">
                <a id="back-link" href="index.html">RETURN TO THE HOUSE</a>
            </footer>
        </article>
    </main>
    <script src="archivo.js?v=20260808-5"></script>
</body>

</html>
