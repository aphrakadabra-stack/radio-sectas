<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÚGJÜ RADIO — Manifesto</title>

    <meta
        name="description"
        content="ÚGJÜ RADIO is a sonic house with its door ajar."
    >

    <meta name="theme-color" content="#EA52F3">

    <link rel="stylesheet" href="manifiesto.css?v=20260727-7">
</head>

<body>

    <main class="manifesto-page">

        <article class="manifesto-sheet">

            <header class="manifesto-header">

                <p
                    class="radio-name"
                    aria-label="ÚGJÜ RADIO"
                >
                    <span
                        class="radio-name-line"
                        aria-hidden="true"
                    >
                        <span>Ú</span>
                        <span>G</span>
                        <span>J</span>
                        <span>Ü</span>
                    </span>

                    <span
                        class="radio-name-line"
                        aria-hidden="true"
                    >
                        <span>R</span>
                        <span>A</span>
                        <span>D</span>
                        <span>I</span>
                        <span>O</span>
                    </span>
                </p>

                <h1 id="manifesto-title">
                    MANIFESTO
                </h1>

                <p id="manifesto-subtitle">
                    The ear that listens to the house...
                </p>

            </header>

            <div id="manifesto-content"></div>

            <footer class="manifesto-footer">

                <button
                    class="radio-email"
                    id="email-link"
                    type="button"
                    aria-label="Email ÚGJÜ RADIO"
                    title="Email ÚGJÜ RADIO"
                >
                    <svg
                        viewBox="0 0 24 18"
                        aria-hidden="true"
                    >
                        <rect
                            x="1"
                            y="1"
                            width="22"
                            height="16"
                        ></rect>

                        <path d="M2 2L12 10L22 2"></path>
                    </svg>
                </button>

                <a
                    id="back-link"
                    href="index.html"
                >
                    RETURN TO THE HOUSE
                </a>

    </main>

    <script src="manifiesto.js?v=20260727-6"></script>
