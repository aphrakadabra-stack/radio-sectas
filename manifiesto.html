<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://paypal.me; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://api.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://archive.org https://*.archive.org https://s3.free-shoutcast.com; connect-src 'self' https://archive.org https://*.archive.org https://*.workers.dev https://*.onesignal.com https://*.free-shoutcast.com; frame-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    >
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÚGJÜ RADIO — Manifesto</title>

    <meta
        name="description"
        content="Manifesto of ÚGJÜ RADIO (UGJU RADIO), an independent online radio and a project within ÚGJÜ SECTAS."
    >

    <meta
        name="keywords"
        content="ÚGJÜ RADIO, UGJU RADIO, ÚGJÜ SECTAS, UGJU SECTAS, radio manifesto, independent online radio"
    >

    <meta name="robots" content="index,follow">

    <meta name="theme-color" content="#EA52F3">
    <meta name="ugju-observatory" content="https://ugju-radio-observatory.ugjusectas.workers.dev/event">

    <link rel="manifest" href="manifest.json?v=20260809-2">

    <link
        rel="apple-touch-icon"
        href="images/icon-charcoal-lowered-192.png?v=20260809-2"
    >

    <link
        rel="canonical"
        href="https://ugjusectas.github.io/ugju-radio/manifiesto.html"
    >

    <link rel="stylesheet" href="manifiesto.css?v=20260821-5">

    <script src="radio-notifications-config.js?v=20260826-1"></script>
</head>

<body>

    <main class="manifesto-page">

        <article class="manifesto-sheet">

            <header class="manifesto-header">

                <img
                    class="radio-name"
                    src="images/icon-charcoal-lowered-192.png?v=20260809-2"
                    alt="ÚGJÜ RADIO"
                    width="192"
                    height="192"
                >

                <h1 id="manifesto-title">
                    MANIFESTO
                </h1>

                <p id="manifesto-subtitle">
                    ... The ear that listens to the house
                </p>

            </header>

            <div id="manifesto-content"></div>

            <p id="manifesto-project">
                ÚGJÜ RADIO is a project within ÚGJÜ SECTAS.
            </p>

            <footer class="manifesto-footer">

                <div class="manifesto-actions">

                    <button
                        class="manifesto-notify"
                        id="notify-link"
                        data-radio-notifications
                        type="button"
                        aria-label="Notify me"
                        title="Notify me"
                    >
                        <svg
                            viewBox="0 0 24 18"
                            aria-hidden="true"
                        >
                            <path
                                d="M18 7a6 6 0 0 0-12 0c0 5-3 6-3 8h18c0-2-3-3-3-8"
                            ></path>

                            <path d="M10 17h4"></path>
                        </svg>
                    </button>

                    <a
                        class="radio-email"
                        id="email-link"
                        href="mailto:ugjusectas@gmail.com"
                        aria-label="Email ÚGJÜ RADIO"
                        title="Email ÚGJÜ RADIO"
                    >
                        <svg
                            viewBox="0 0 24 18"
                            aria-hidden="true"
                        >
                            <rect
                                x="1"
                                y="1"
                                width="22"
                                height="16"
                            ></rect>

                            <path d="M2 2L12 10L22 2"></path>
                        </svg>
                    </a>

                    <button
                        class="manifesto-support"
                        id="support-link"
                        type="button"
                    >
                        SUPPORT
                    </button>

                </div>

                <a
                    id="back-link"
                    href="index.html"
                >
                    RETURN TO THE HOUSE
                </a>

            </footer>

            <section
                class="support-panel"
                id="support-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="support-title"
                hidden
            >

                <div class="support-card">

                    <h2 id="support-title">
                        SUPPORT ÚGJÜ RADIO
                    </h2>

                    <button
                        class="support-option"
                        id="support-argentina"
                        type="button"
                    >
                        ARGENTINA — COPY ALIAS
                    </button>

                    <a
                        class="support-option"
                        id="support-paypal"
                        href="https://paypal.me/chromemoon"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        OTHER COUNTRIES — PAYPAL
                    </a>

                    <p
                        class="support-status"
                        id="support-status"
                        aria-live="polite"
                    ></p>

                    <button
                        class="support-close"
                        id="support-close"
                        type="button"
                    >
                        CLOSE
                    </button>

                </div>

            </section>

        </article>

    </main>

    <script src="observatory.js?v=20260821-2"></script>
    <script src="radio-notifications.js?v=20260827-1"></script>
    <script src="manifiesto.js?v=20260823-1"></script>

</body>

</html>
