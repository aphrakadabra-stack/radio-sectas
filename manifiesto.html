<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÚGJÜ RADIO — Manifesto</title>

    <meta
        name="description"
        content="ÚGJÜ RADIO is a sonic house with its door ajar."
    >

    <meta name="theme-color" content="#EA52F3">

    <link rel="stylesheet" href="manifiesto.css?v=20260728-17">

    <script
        src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
        defer
    ></script>

    <script>
        window.OneSignalDeferred =
            window.OneSignalDeferred || [];

        OneSignalDeferred.push(
            async function(OneSignal) {

                await OneSignal.init({
                    appId:
                        "e4712649-ca34-49e6-a2b4-f2ca6c5c7460",

                    safari_web_id:
                        "web.onesignal.auto.4b99c5db-a7c9-461a-8333-facb0838095d",

                    serviceWorkerPath:
                        "ugju-radio/OneSignalSDKWorker.js",

                    serviceWorkerParam: {
                        scope: "/ugju-radio/"
                    },

                    notifyButton: {
                        enable: false
                    }
                });

                window.ugjuOneSignal = OneSignal;

                document.dispatchEvent(
                    new CustomEvent(
                        "ugju-onesignal-ready"
                    )
                );

            }
        );
    </script>
</head>

<body>

    <main class="manifesto-page">

        <article class="manifesto-sheet">

            <header class="manifesto-header">

                <p
                    class="radio-name"
                    aria-label="ÚGJÜ RADIO"
                >
                    <span
                        class="radio-name-line"
                        aria-hidden="true"
                    >
                        <span>Ú</span>
                        <span>G</span>
                        <span>J</span>
                        <span>Ü</span>
                    </span>

                    <span
                        class="radio-name-line"
                        aria-hidden="true"
                    >
                        <span>R</span>
                        <span>A</span>
                        <span>D</span>
                        <span>I</span>
                        <span>O</span>
                    </span>
                </p>

                <h1 id="manifesto-title">
                    MANIFESTO
                </h1>

                <p id="manifesto-subtitle">
                    ... The ear that listens to the house
                </p>

            </header>

            <div id="manifesto-content"></div>

            <footer class="manifesto-footer">

                <div class="manifesto-actions">

                    <button
                        class="radio-email"
                        id="email-link"
                        type="button"
                        aria-label="Email ÚGJÜ RADIO"
                        title="Email ÚGJÜ RADIO"
                    >
                        <svg
                            viewBox="0 0 24 18"
                            aria-hidden="true"
                        >
                            <rect
                                x="1"
                                y="1"
                                width="22"
                                height="16"
                            ></rect>

                            <path d="M2 2L12 10L22 2"></path>
                        </svg>
                    </button>

                    <button
                        class="manifesto-notify"
                        id="notify-link"
                        type="button"
                        aria-label="Notify me"
                        title="Notify me"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                            ></path>

                            <path d="M10 21h4"></path>
                        </svg>
                    </button>

                </div>

                <a
                    id="back-link"
                    href="index.html"
                >
                    RETURN TO THE HOUSE
                </a>

            </footer>

        </article>

    </main>

    <script src="manifiesto.js?v=20260728-17"></script>

</body>

</html>
