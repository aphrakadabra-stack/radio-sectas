<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÚGJÜ RADIO — Manifesto</title>

    <meta
        name="description"
        content="ÚGJÜ RADIO is a sonic house with its door ajar."
    >

    <meta name="theme-color" content="#EA52F3">

    <link rel="stylesheet" href="manifiesto.css">
</head>

<body>

    <main class="score-shell">

        <section
            class="score"
            aria-labelledby="manifesto-title"
        >

            <div class="score-rings" aria-hidden="true"></div>
            <div class="score-spokes" aria-hidden="true"></div>

            <header class="score-header">

                <p class="radio-name">ÚGJÜ RADIO</p>

                <h1 id="manifesto-title">MANIFESTO</h1>

                <p id="manifesto-subtitle">
                    The ear that listens to the house...
                </p>

            </header>

            <div
                id="score-content"
                aria-hidden="true"
            ></div>

            <a
                id="back-link"
                href="index.html"
            >
                RETURN TO THE HOUSE
            </a>

        </section>

        <article
            id="accessible-manifesto"
            class="screen-reader-only"
        ></article>

    </main>

    <script src="manifiesto.js"></script>

</body>

</html>
