<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÚGJÜ RADIO</title>

    <meta
        name="description"
        content="La oreja que escucha la casa..."
    >

    <meta name="theme-color" content="#EA52F3">

    <link
        rel="canonical"
        href="https://ugjusectas.github.io/ugju-radio/"
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ÚGJÜ RADIO">
    <meta property="og:title" content="ÚGJÜ RADIO">

    <meta
        property="og:description"
        content="La oreja que escucha la casa..."
    >

    <meta
        property="og:url"
        content="https://ugjusectas.github.io/ugju-radio/"
    >

    <meta
        property="og:image"
        content="https://ugjusectas.github.io/ugju-radio/images/web1.webp"
    >

    <meta
        property="og:image:alt"
        content="La casa de ÚGJÜ RADIO"
    >

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ÚGJÜ RADIO">

    <meta
        name="twitter:description"
        content="La oreja que escucha la casa..."
    >

    <meta
        name="twitter:image"
        content="https://ugjusectas.github.io/ugju-radio/images/web1.webp"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="radio">

        <h1>ÚGJÜ RADIO</h1>

        <p class="subtitle">
            La oreja que escucha la casa...
        </p>

        <div id="state">
            HABITADA
        </div>

        <img
            src="images/web1.webp"
            class="radio-image"
            alt="La casa de ÚGJÜ RADIO"
        >

        <div class="player">

            <div
                data-type="newStreamPlayer"
                data-publicToken="ce595496-3ed3-465e-b7fb-a67b577d9812"
                data-theme="dark"
                data-color="EA52F3"
                data-channelId="a256cdde-27eb-43f9-b64e-857f519fd977"
                data-rendered="false"
                class="cstrEmbed"
            >
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>

        </div>

        <p class="house-note">
            <span class="house-note-line house-note-line-one">
                esta casa no tiene horarios...
            </span>

            <span class="house-note-line house-note-line-two">
                si no oyes nada, volvé a pispear más tarde
            </span>
        </p>

        <nav
            class="house-links"
            aria-label="Puertas de ÚGJÜ RADIO"
        >

            <a
                class="manifesto-link"
                href="manifiesto.html"
            >
                MANIFIESTO
            </a>

            <a
                class="linktree-link"
                href="https://linktr.ee/ugju.sectas"
                aria-label="Abrir Linktree de ÚGJÜ SECTAS"
                title="ÚGJÜ SECTAS"
            >
                <span aria-hidden="true">✱</span>
            </a>

        </nav>

    </main>

    <section
        id="manifesto-layer"
        class="manifesto-layer"
        aria-hidden="true"
    >

        <button
            id="manifesto-close"
            class="manifesto-close"
            type="button"
            aria-label="Cerrar manifiesto"
        >
            ×
        </button>

        <iframe
            id="manifesto-frame"
            class="manifesto-frame"
            data-src="manifiesto.html"
            title="Manifiesto de ÚGJÜ RADIO"
        ></iframe>

    </section>

    <script src="script.js"></script>
    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

</body>

</html>
