<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÚGJÜ RADIO — UGJU RADIO</title>

    <meta
        name="description"
        content="ÚGJÜ RADIO (UGJU RADIO) is an independent online radio by ÚGJÜ SECTAS: experimental music, living archives, jamming and sounds outside the algorithm."
    >

    <meta
        name="keywords"
        content="ÚGJÜ RADIO, UGJU RADIO, Ugju Radio, ÚGJÜ SECTAS, UGJU SECTAS, independent radio, online radio, experimental music, internet radio"
    >

    <meta name="robots" content="index,follow">

    <meta name="theme-color" content="#EA52F3">

    <link rel="manifest" href="manifest.json?v=20260810-3">

    <link
        rel="apple-touch-icon"
        href="images/icon-charcoal-lowered-192.png?v=20260809-2"
    >

    <link
        rel="canonical"
        href="https://ugjusectas.github.io/ugju-radio/"
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ÚGJÜ RADIO">
    <meta property="og:title" content="ÚGJÜ RADIO">

    <meta
        property="og:description"
        content="The ear that listens to the house..."
    >

    <meta
        property="og:url"
        content="https://ugjusectas.github.io/ugju-radio/"
    >

    <meta
        property="og:image"
        content="https://ugjusectas.github.io/ugju-radio/images/web1.webp"
    >

    <meta
        property="og:image:alt"
        content="The house of ÚGJÜ RADIO"
    >

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ÚGJÜ RADIO">

    <meta
        name="twitter:description"
        content="The ear that listens to the house..."
    >

    <meta
        name="twitter:image"
        content="https://ugjusectas.github.io/ugju-radio/images/web1.webp"
    >

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "RadioStation",
        "@id": "https://ugjusectas.github.io/ugju-radio/#radio",
        "name": "ÚGJÜ RADIO",
        "alternateName": [
            "UGJU RADIO",
            "Ugju Radio"
        ],
        "description": "Independent online radio for experimental music, living archives, jamming and sounds outside the algorithm.",
        "url": "https://ugjusectas.github.io/ugju-radio/",
        "image": "https://ugjusectas.github.io/ugju-radio/images/web1.webp",
        "sameAs": [
            "https://linktr.ee/ugju.sectas"
        ],
        "parentOrganization": {
            "@type": "Organization",
            "name": "ÚGJÜ SECTAS",
            "alternateName": "UGJU SECTAS",
            "url": "https://linktr.ee/ugju.sectas"
        }
    }
    </script>

    <link rel="stylesheet" href="style.css?v=20260814-1">

    <script
        src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
        defer
    ></script>

    <script>
        window.OneSignalDeferred =
            window.OneSignalDeferred || [];

        OneSignalDeferred.push(
            async function(OneSignal) {

                await OneSignal.init({
                    appId:
                        "e4712649-ca34-49e6-a2b4-f2ca6c5c7460",

                    safari_web_id:
                        "web.onesignal.auto.4b99c5db-a7c9-461a-8333-facb0838095d",

                    serviceWorkerPath:
                        "ugju-radio/OneSignalSDKWorker.js",

                    serviceWorkerParam: {
                        scope: "/ugju-radio/"
                    },

                    notifyButton: {
                        enable: false
                    }
                });

                window.ugjuOneSignal = OneSignal;

                document.dispatchEvent(
                    new CustomEvent(
                        "ugju-onesignal-ready"
                    )
                );

            }
        );
    </script>
</head>

<body>

    <main id="radio">

        <h1>ÚGJÜ RADIO</h1>

        <p class="subtitle">
            The ear that listens to the house...
        </p>

        <div id="state"></div>

        <div class="radio-visual">
            <img
                src="images/web1.webp"
                class="radio-image"
                alt="The house of ÚGJÜ RADIO"
            >

            <button
                class="window-trigger"
                id="window-trigger"
                type="button"
                aria-label="Open the upstairs window"
                disabled
            ></button>
        </div>

        <div class="player">

            <div class="live-controls" id="live-controls">
                <span
                    class="live-status"
                    id="live-status"
                    data-live="false"
                    aria-live="polite"
                >
                    <span id="live-status-label">IN CLOUDS</span>
                </span>

                <button
                    class="live-toggle"
                    id="live-toggle"
                    type="button"
                    aria-pressed="false"
                    hidden
                    disabled
                >
                    <span aria-hidden="true" id="live-toggle-icon">▶</span>
                    <span id="live-toggle-label" hidden>PLAY</span>
                </button>

                <p class="live-metadata" id="live-metadata" hidden>
                    <span
                        class="live-metadata-track"
                        id="live-metadata-track"
                    ></span>
                </p>
            </div>

            <section
                class="archive-session"
                id="archive-session"
                aria-live="polite"
                hidden
            >
                <p class="archive-session-now">
                    <span class="archive-session-track" id="archive-session-track">
                        <span id="archive-session-label">ARCHIVE</span>
                        —
                        <span id="archive-session-title"></span>
                    </span>
                </p>

                <div class="archive-session-actions">
                    <button
                        id="archive-session-toggle"
                        type="button"
                    >
                        PAUSE
                    </button>

                    <button
                        id="live-return"
                        type="button"
                    >
                        RETURN TO LIVE RADIO
                    </button>
                </div>
            </section>

            <audio
                id="archive-audio"
                preload="metadata"
                playsinline
            ></audio>

            <audio
                id="live-audio"
                preload="none"
                playsinline
            ></audio>

        </div>

        <aside class="visitor-guide">

            <p class="house-note">
                <span class="house-note-line house-note-line-one">
                    this house keeps no hours...
                </span>

                <span class="house-note-line house-note-line-two">
                    if there is nothing to listen to, come back and take another peek later
                </span>
            </p>

        </aside>

        <a
            class="manifesto-link"
            href="https://ugjusectas.github.io/ugju-radio/manifiesto.html"
        >
            MANIFESTO
        </a>

        <a
            class="archive-link"
            href="https://ugjusectas.github.io/ugju-radio/archivo.html"
        >
            ARCHIVE
        </a>

        <a
            class="linktree-link"
            href="https://linktr.ee/ugju.sectas"
            aria-label="Open ÚGJÜ SECTAS on Linktree"
            title="ÚGJÜ SECTAS"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/linktree.svg"
                alt=""
                aria-hidden="true"
            >
        </a>

    </main>

    <section
        class="window-overlay"
        id="window-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="The upstairs window"
        hidden
    >
        <div class="window-photo-frame">
            <img
                class="window-photo"
                data-src="images/window-exhibit.jpg"
                alt="Inside the house of ÚGJÜ RADIO"
                decoding="async"
            >

            <button
                class="window-close"
                id="window-close"
                type="button"
                aria-label="Close"
                hidden
            >×</button>
        </div>
    </section>

    <section
        class="manifesto-overlay"
        id="manifesto-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Manifesto"
        hidden
    >
        <iframe
            id="manifesto-frame"
            title="ÚGJÜ RADIO — Manifesto"
        ></iframe>
    </section>

    <section
        class="archive-overlay"
        id="archive-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Archive"
        hidden
    >
        <iframe
            id="archive-frame"
            title="ÚGJÜ RADIO — Archive"
        ></iframe>
    </section>

    <script src="script.js?v=20260814-2"></script>

</body>

</html>
