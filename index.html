<!DOCTYPE html>
<html lang="en">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

        content="ÚGJÜ RADIO, UGJU RADIO, Ugju Radio, ÚGJÜ SECTAS, UGJU SECTAS, independent radio, online radio, experimental music, internet radio"
    >

    <meta name="robots" content="index,follow">

    <meta name="theme-color" content="#EA52F3">

    <link rel="manifest" href="manifest.json">

    <link
        rel="apple-touch-icon"
        href="images/icon-192.png"
    >

    <link
        rel="canonical"
        href="https://ugjusectas.github.io/ugju-radio/"
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ÚGJÜ RADIO">
    <meta property="og:title" content="ÚGJÜ RADIO">

    <meta
        property="og:description"
        content="The ear that listens to the house..."
    >

    <meta
        property="og:url"
        content="https://ugjusectas.github.io/ugju-radio/"
    >

    <meta
        property="og:image"
        content="https://ugjusectas.github.io/ugju-radio/images/web1.webp"
    >

    <meta
        property="og:image:alt"
        content="The house of ÚGJÜ RADIO"
    >

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ÚGJÜ RADIO">

    <meta
        name="twitter:description"
        content="The ear that listens to the house..."
    >

    <meta
        name="twitter:image"
        content="https://ugjusectas.github.io/ugju-radio/images/web1.webp"
    >

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "RadioStation",
        "@id": "https://ugjusectas.github.io/ugju-radio/#radio",
        "name": "ÚGJÜ RADIO",
        "alternateName": [
            "UGJU RADIO",
            "Ugju Radio"
        ],
        "description": "Independent online radio for experimental music, living archives, jamming and sounds outside the algorithm.",
        "url": "https://ugjusectas.github.io/ugju-radio/",
        "image": "https://ugjusectas.github.io/ugju-radio/images/web1.webp",
        "sameAs": [
            "https://linktr.ee/ugju.sectas"
        ],
        "parentOrganization": {
            "@type": "Organization",
            "name": "ÚGJÜ SECTAS",
            "alternateName": "UGJU SECTAS",
            "url": "https://linktr.ee/ugju.sectas"
        }
    }
    </script>

    <link rel="stylesheet" href="style.css?v=20260808-5">

    <script
        src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
        defer
    ></script>

    <script>
        window.OneSignalDeferred =
            window.OneSignalDeferred || [];

        OneSignalDeferred.push(
            async function(OneSignal) {

                await OneSignal.init({
                    appId:
                        "e4712649-ca34-49e6-a2b4-f2ca6c5c7460",

                    safari_web_id:
                        "web.onesignal.auto.4b99c5db-a7c9-461a-8333-facb0838095d",

                    serviceWorkerPath:
                        "ugju-radio/OneSignalSDKWorker.js",

                    serviceWorkerParam: {
                        scope: "/ugju-radio/"
                    },

                    notifyButton: {
                        enable: false
                    }
                });

                window.ugjuOneSignal = OneSignal;

                document.dispatchEvent(
                    new CustomEvent(
                        "ugju-onesignal-ready"
                    )
                );

            }
        );
    </script>
</head>

<body>

    <main id="radio">

        <h1>ÚGJÜ RADIO</h1>

        <p class="subtitle">
            The ear that listens to the house...
        </p>

        <div id="state">
            INHABITED
        </div>

        <img
            src="images/web1.webp"
            class="radio-image"
            alt="The house of ÚGJÜ RADIO"
        >

        <div class="player">

            <div
                data-type="newStreamPlayer"
                data-publicToken="ce595496-3ed3-465e-b7fb-a67b577d9812"
                data-theme="dark"
                data-color="EA52F3"
                data-channelId="a256cdde-27eb-43f9-b64e-857f519fd977"
                data-rendered="false"
                class="cstrEmbed"
            >
                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>

            <section
                class="archive-session"
                id="archive-session"
                aria-live="polite"
                hidden
            >
                <p class="archive-session-now">
                    <span id="archive-session-label">ARCHIVE</span>
                    —
                    <span id="archive-session-title"></span>
                </p>

                <div class="archive-session-actions">
                    <button
                        id="archive-session-toggle"
                        type="button"
                    >
                        PAUSE
                    </button>

                    <button
                        id="live-return"
                        type="button"
                    >
                        RETURN TO LIVE RADIO
                    </button>
                </div>
            </section>

            <audio
                id="archive-audio"
                preload="metadata"
                playsinline
            ></audio>

        </div>

        <aside class="visitor-guide">

            <p class="house-note">
                <span class="house-note-line house-note-line-one">
                    this house keeps no hours...
                </span>

                <span class="house-note-line house-note-line-two">
                    if there is nothing to listen to, come back and take another peek later
                </span>
            </p>

        </aside>

        <a
            class="manifesto-link"
            href="https://ugjusectas.github.io/ugju-radio/manifiesto.html"
        >
            MANIFESTO
        </a>

        <a
            class="archive-link"
            href="https://ugjusectas.github.io/ugju-radio/archivo.html"
        >
            ARCHIVE
        </a>

        <a
            class="linktree-link"
            href="https://linktr.ee/ugju.sectas"
            aria-label="Open ÚGJÜ SECTAS on Linktree"
            title="ÚGJÜ SECTAS"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/linktree.svg"
                alt=""
                aria-hidden="true"
            >
        </a>

    </main>

    <section
        class="manifesto-overlay"
        id="manifesto-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Manifesto"
        hidden
    >
        <iframe
            id="manifesto-frame"
            title="ÚGJÜ RADIO — Manifesto"
        ></iframe>
    </section>

    <section
        class="archive-overlay"
        id="archive-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Archive"
        hidden
    >
        <iframe
            id="archive-frame"
            title="ÚGJÜ RADIO — Archive"
        ></iframe>
    </section>

    <script src="script.js?v=20260808-3"></script>
    <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

</body>

</html>
